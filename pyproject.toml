[project]
name = "flow"
version = "0.1.0"
description = "Multi-agent critical-import resilience for India (oil, LNG, fertilizers)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kartik Agrawal" }]
dependencies = [
    "httpx>=0.27",
    "networkx>=3.4",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.scripts]
flow = "flow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
agents = [
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "mcp>=1.2",
]
intel = [
    "chromadb>=0.5",
]
viz = [
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "notebook>=7.6.2",
    "plotly>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
